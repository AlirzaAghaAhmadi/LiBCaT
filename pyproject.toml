[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "libcat-retrieval"
version = "0.1.0"
description = "LiBCaT: research-oriented breast-cancer clinical trial retrieval and TREC evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
keywords = ["clinical trials", "information retrieval", "BM25", "TREC", "breast cancer"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = ["numpy>=1.26,<3", "pandas>=2.0,<3", "requests>=2.31,<3"]

[project.optional-dependencies]
web = ["streamlit>=1.37,<2"]
dense = ["sentence-transformers>=3,<6", "transformers>=4,<6", "torch>=2"]
all = ["streamlit>=1.37,<2", "sentence-transformers>=3,<6", "transformers>=4,<6", "torch>=2"]
dev = ["pytest>=8,<10", "build>=1,<2"]

[tool.setuptools.packages.find]
include = ["libcat*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
